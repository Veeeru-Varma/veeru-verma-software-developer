<head>

    <style>
        :root {
            --bg: #f7f7f4;
            --ink: #111214;
            --muted: #72736f;
            --line: #e4e2da;
            --yellow: #f4c400;
            --max: 1240px
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "DM Sans",sans-serif
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .wrap {
            width: min(var(--max),calc(100% - 52px));
            margin: auto
        }

        header {
            height: 78px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            background: rgba(247,247,244,.94)
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .brand {
            font: 800 17px Manrope,sans-serif;
            letter-spacing: -.04em
        }

            .brand span {
                color: #b18c00
            }

        .back {
            font-size: 13px;
            font-weight: 700;
            border-bottom: 1px solid var(--ink);
            padding: 8px 0
        }

        .hero {
            padding: 48px 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 24px
        }

        .kicker {
            font-size: 11px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: #8b7a42;
            font-weight: 800
        }

        h1 {
            font: 800 clamp(40px,5.2vw,64px)/1.02 Manrope,sans-serif;
            letter-spacing: -.065em;
            margin: 12px 0 10px
        }

        .intro {
            max-width: 480px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
            margin: 0
        }

        .count {
            font: 700 13px Manrope,sans-serif;
            white-space: nowrap;
            color: #666
        }

        .lightbox-nav {
            width: 42px;
            height: 42px;
            border: 1px solid #ffffff88;
            background: #111c;
            color: white;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            display: grid;
            place-items: center
        }

        .filters {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            padding: 16px 0 26px;
            border-top: 1px solid var(--line)
        }

        .filter {
            border: 1px solid #d8d6ce;
            background: transparent;
            border-radius: 30px;
            padding: 9px 16px;
            font: 700 12px "DM Sans";
            cursor: pointer
        }

            .filter.active, .filter:hover {
                background: var(--ink);
                border-color: var(--ink);
                color: #fff
            }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            align-items: start;
            padding-bottom: 80px
        }

        .photo-card {
            margin: 0;
            background: white;
            border: 1px solid var(--line);
            padding: 7px;
        }

        .photo-open {
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            background: #eceae3;
            cursor: zoom-in;
            position: relative;
            overflow: hidden
        }

            .photo-open img {
                display: block;
                width: 100%;
                height: auto;
                max-height: 620px;
                object-fit: cover;
                transition: transform .55s cubic-bezier(.2,.7,.2,1);
            }

            .photo-open:hover img {
                transform: scale(1.035)
            }

        .photo-index {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(17,18,20,.76);
            color: white;
            padding: 6px 9px;
            font-size: 10px;
            letter-spacing: .1em
        }

        figcaption {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 12px 7px 7px;
            font-size: 13px;
            font-weight: 700
        }

            figcaption small {
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: .12em;
                color: #999;
                font-weight: 700
            }

        footer {
            border-top: 1px solid var(--line);
            padding: 22px 0 34px;
            color: #85857f;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            gap: 14px
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(10,11,12,.94);
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px
        }

            .lightbox.open {
                display: flex
            }

            .lightbox img {
                max-width: min(92vw,1200px);
                max-height: 86vh;
                object-fit: contain;
                box-shadow: 0 20px 80px #0008
            }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            width: 48px;
            height: 48px
        }

        .lightbox-prev {
            left: 22px
        }

        .lightbox-next {
            right: 22px
        }

        .lightbox-meta {
            position: absolute;
            bottom: 18px;
            left: 0;
            right: 0;
            text-align: center;
            color: #ddd;
            font-size: 12px;
            letter-spacing: .08em
        }

        .close {
            position: absolute;
            right: 24px;
            top: 20px;
            color: #fff;
            background: none;
            border: 0;
            font-size: 32px;
            cursor: pointer
        }

        @media(max-width:700px) {
            .wrap {
                width: calc(100% - 32px)
            }

            .lightbox {
                padding: 14px
            }

            .lightbox-nav {
                width: 38px;
                height: 38px
            }

            .lightbox-prev {
                left: 8px
            }

            .lightbox-next {
                right: 8px
            }

            .hero {
                display: block;
                padding: 34px 0 24px
            }

            h1 {
                font-size: clamp(38px,10vw,52px)
            }

            .count {
                display: block;
                margin-top: 18px
            }

            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px
            }

            .photo-card {
                padding: 5px
            }

            figcaption {
                display: block;
                font-size: 11px;
                padding: 9px 4px 5px
            }

                figcaption small {
                    display: block;
                    margin-top: 5px
                }

            footer {
                display: block;
                line-height: 2
            }
        }
    </style>
</head>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo preview"><button class="close" aria-label="Close">×</button><button class="lightbox-nav lightbox-prev" aria-label="Previous photo">‹</button><img src="" alt=""><button class="lightbox-nav lightbox-next" aria-label="Next photo">›</button><div class="lightbox-meta" id="lightboxMeta"></div></div>
    <script>
        const filters = [...document.querySelectorAll('.filter')], cards = [...document.querySelectorAll('.photo-card')];
        filters.forEach(btn => btn.addEventListener('click', () => { filters.forEach(x => x.classList.remove('active')); btn.classList.add('active'); cards.forEach(card => card.hidden = btn.dataset.filter !== 'All' && card.dataset.category !== btn.dataset.filter) }));
        // Full-screen viewer with previous/next navigation
        const box = document.getElementById('lightbox'), big = box.querySelector('img'), meta = document.getElementById('lightboxMeta'); let photoItems = [], photoIndex = 0;
        function refreshPhotoItems() { photoItems = [...document.querySelectorAll('.photo-card')].map(card => ({ src: card.querySelector('img').getAttribute('src'), alt: card.querySelector('img').alt })); }
        function openPhoto(src, alt) { refreshPhotoItems(); photoIndex = Math.max(0, photoItems.findIndex(x => x.src === src)); if (photoIndex < 0) photoIndex = 0; showPhoto(); box.classList.add('open'); document.body.style.overflow = 'hidden' }
        function showPhoto() { const item = photoItems[photoIndex]; if (!item) return; big.src = item.src; big.alt = item.alt; meta.textContent = `${String(photoIndex + 1).padStart(2, '0')} / ${String(photoItems.length).padStart(2, '0')} · ${item.alt}` }
        function movePhoto(step) { photoIndex = (photoIndex + step + photoItems.length) % photoItems.length; showPhoto() }
        function closeBox() { box.classList.remove('open'); big.src = ''; document.body.style.overflow = '' }
        document.querySelectorAll('.photo-open').forEach(btn => btn.addEventListener('click', () => openPhoto(btn.querySelector('img').getAttribute('src'), btn.querySelector('img').alt)));
        box.querySelector('.close').addEventListener('click', closeBox); box.querySelector('.lightbox-prev').addEventListener('click', () => movePhoto(-1)); box.querySelector('.lightbox-next').addEventListener('click', () => movePhoto(1)); box.addEventListener('click', e => { if (e.target === box) closeBox() });
        document.addEventListener('keydown', e => { if (!box.classList.contains('open')) return; if (e.key === 'Escape') closeBox(); if (e.key === 'ArrowLeft') movePhoto(-1); if (e.key === 'ArrowRight') movePhoto(1) });
        let touchStart = 0; box.addEventListener('touchstart', e => touchStart = e.changedTouches[0].screenX, { passive: true }); box.addEventListener('touchend', e => { const delta = e.changedTouches[0].screenX - touchStart; if (Math.abs(delta) > 45) movePhoto(delta < 0 ? 1 : -1) }, { passive: true });


        // Keep serial numbers in the same left-to-right order as the CSS Grid.
        cards.forEach((card, index) => {
            const number = card.querySelector(".photo-index");
            if (number) number.textContent = String(index + 1).padStart(2, "0");
        });
    </script>
